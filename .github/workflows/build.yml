# ═══════════════════════════════════════════════════════════════════════════════
# Throne — Production CI/CD Pipeline (amd64 ONLY)
# ═══════════════════════════════════════════════════════════════════════════════
# Architecture: Strictly x86_64 / amd64. All ARM, i686, 32-bit targets purged.
# Build system: Ninja + ccache for maximum parallelism.
# Qt: Latest stable Qt 6 via aqtinstall with aggressive caching.
# Go: Latest 1.25.x with module-level caching.
# ═══════════════════════════════════════════════════════════════════════════════
name: Throne build matrix (amd64)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag and version"
        required: true
      publish:
        description: "r for normal release, p for prerelease, leave empty to not publish"
        required: false

# ─── Global env ───────────────────────────────────────────────────────────────
env:
  QT_VERSION: "6.10.1"          # Single source of truth for Qt version
  GO_VERSION: "1.25.5"          # Single source of truth for Go version
  CCACHE_MAXSIZE: "500M"        # ccache disk budget
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"

# ─── Job: build-go ────────────────────────────────────────────────────────────
# Builds the Go backend (sing-box + Xray-core + protorpc server) for amd64 only.
jobs:
  build-go:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # ── amd64 targets only ──
          - cross_os: windows
            cross_arch: amd64
          - cross_os: linux
            cross_arch: amd64
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.2.2
        with:
          submodules: "recursive"

      # ── Go build cache (module + build) ──
      - name: Cache Go modules & build
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ matrix.cross_os }}-${{ matrix.cross_arch }}-${{ env.GO_VERSION }}-${{ hashFiles('core/server/go.sum') }}
          restore-keys: |
            go-${{ matrix.cross_os }}-${{ matrix.cross_arch }}-${{ env.GO_VERSION }}-

      # ── Core binary artifacts cache ──
      - name: Cache Go artifacts
        id: cache-go-artifacts
        uses: actions/cache@v4.2.3
        with:
          path: artifacts.tgz
          key: GoArtifacts-${{ matrix.cross_os }}-${{ matrix.cross_arch }}-${{ hashFiles('script/build_go.sh', 'core/**') }}-${{ env.GO_VERSION }}

      - name: Install Go
        if: steps.cache-go-artifacts.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/server/go.sum

      - name: Install Protoc
        if: steps.cache-go-artifacts.outputs.cache-hit != 'true'
        run: |
          PROTOC_VER="31.1"
          curl -fLO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VER}/protoc-${PROTOC_VER}-linux-x86_64.zip"
          unzip "protoc-${PROTOC_VER}-linux-x86_64.zip" -d protoc_install
          sudo cp ./protoc_install/bin/protoc /usr/local/bin
          protoc --version

      - name: Install protoc Go plugins
        if: steps.cache-go-artifacts.outputs.cache-hit != 'true'
        run: |
          go install github.com/golang/protobuf/protoc-gen-go@latest
          go install github.com/chai2010/protorpc/protoc-gen-protorpc@latest

      - name: Build Go backend
        if: steps.cache-go-artifacts.outputs.cache-hit != 'true'
        shell: bash
        run: |
          GOOS=${{ matrix.cross_os }} GOARCH=${{ matrix.cross_arch }} ./script/build_go.sh

      - name: Tar artifacts
        if: steps.cache-go-artifacts.outputs.cache-hit != 'true'
        run: tar czvf artifacts.tgz ./deployment

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Throne-${{ github.sha }}-Go-${{ matrix.cross_os }}-${{ matrix.cross_arch }}
          path: artifacts.tgz

  # ─── Job: build-cpp ───────────────────────────────────────────────────────────
  # Builds the Qt 6 C++ GUI for amd64 on each platform.
  # Uses ccache + Ninja for maximum rebuild speed.
  build-cpp:
    permissions:
      contents: read
    needs: [build-go]
    strategy:
      matrix:
        include:
          # ── Windows amd64 (MSVC + static Qt) ──
          - platform: windows-latest
            os_label: windows
            target: x86_64
            compiler: msvc
          # ── Linux amd64 ──
          - platform: ubuntu-22.04
            os_label: linux
            target: amd64
            compiler: gcc
      fail-fast: false
    runs-on: ${{ matrix.platform }}
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      INPUT_VERSION: ${{ github.event.inputs.tag }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.2.2
        with:
          submodules: "recursive"

      # ── Download Go artifacts ──
      - name: Download Go artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          path: download-artifact

      # ── MSVC setup (Windows) ──
      - name: Install MSVC compiler
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.target }}

      # ── ccache ──
      - name: Install ccache
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y ccache
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            choco install ccache -y
          fi
          ccache --version

      - name: Restore ccache
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.ccache
            ~/AppData/Local/ccache
          key: ccache-${{ matrix.os_label }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os_label }}-${{ matrix.target }}-

      # ── Qt 6 installation via aqtinstall with caching ──
      - name: Install Qt 6 (aqtinstall)
        uses: jurplel/install-qt-action@v4.3.0
        with:
          version: ${{ env.QT_VERSION }}
          setup-python: true
          cache: true
          cache-key-prefix: Qt-${{ env.QT_VERSION }}-${{ matrix.os_label }}-${{ matrix.target }}

      # ── OpenSSL (Windows static) ──
      - name: OpenSSL cache (Windows)
        id: cache-openssl
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4.2.3
        with:
          path: C:/vcpkg/installed/x64-windows-static
          key: OpenSSL-${{ matrix.os_label }}-${{ matrix.target }}

      - name: Install OpenSSL (Windows)
        if: matrix.platform == 'windows-latest' && steps.cache-openssl.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append
          vcpkg install openssl:x64-windows-static

      # ══════════════════════════════════════════════════════════════════════════
      #   BUILD — Ninja + ccache
      # ══════════════════════════════════════════════════════════════════════════

      - name: Configure & Build (Windows)
        shell: bash
        if: matrix.platform == 'windows-latest'
        run: |
          export OPENSSL_ROOT_DIR="C:/vcpkg/installed/x64-windows-static"
          mkdir -p build && cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ..
          ninja -j$(nproc 2>/dev/null || echo 4)
          cd ..
          ./script/deploy_windows.sh

      - name: Configure & Build (Linux)
        shell: bash
        if: contains(matrix.platform, 'ubuntu')
        run: |
          mkdir -p build && cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++" \
            ..
          ninja -j$(nproc)
          cd ..
          ./script/deploy_linux64.sh

      # ── NSIS installer (Windows only) ──
      - name: Build Windows Installer
        shell: cmd
        if: matrix.platform == 'windows-latest'
        run: |
          choco install nsis
          cp .\script\windows_installer.nsi .
          "C:\Program Files (x86)\NSIS\makensis.exe" windows_installer.nsi
          cp ThroneSetup.exe deployment/

      # ── ccache stats for diagnostics ──
      - name: ccache statistics
        shell: bash
        run: ccache -s

      # ── Upload ──
      - name: Tar artifacts
        shell: bash
        run: tar czvf artifacts.tgz ./deployment

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Throne-${{ github.sha }}-${{ matrix.os_label }}-${{ matrix.target }}-Qt${{ env.QT_VERSION }}
          path: artifacts.tgz

  # ─── Job: publish ──────────────────────────────────────────────────────────────
  publish:
    name: Pack & Publish Release (amd64 only)
    runs-on: ubuntu-latest
    needs: [build-cpp]
    permissions:
      contents: write
      actions: read
    env:
      INPUT_VERSION: ${{ github.event.inputs.tag }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          path: download-artifact

      - name: Pack release archives
        run: |
          curl -Lo - https://github.com/tcnksm/ghr/releases/download/v0.17.0/ghr_v0.17.0_linux_amd64.tar.gz | tar xzv
          mv ghr*linux_amd64/ghr .
          source script/env_deploy.sh
          find . -name artifacts.tgz | xargs -n1 tar xvzf
          cd deployment
          mkdir -p debug
          ####
          bash ../script/pack_debian.sh ${{ github.event.inputs.tag }}
          mv Throne.deb $version_standalone-debian-x64.deb
          rm -rf Throne
          ####
          mv linux-amd64 Throne
          mv Throne/Throne.debug debug/$version_standalone-linux-amd64.debug
          zip -9 -r $version_standalone-linux-amd64.zip Throne
          rm -rf Throne
          ####
          if [ -f ThroneSetup.exe ]; then
            mv ThroneSetup.exe $version_standalone-windows64-installer.exe
          fi
          mv windows64 Throne
          mv Throne/Throne.pdb debug/$version_standalone-windows64.pdb
          zip -9 -r $version_standalone-windows64.zip Throne
          rm -rf Throne
          ####
          zip -9 -r debug-symbols.zip debug

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Debug-${{ github.sha }}
          path: deployment/debug-symbols.zip

      - name: Clean staging
        run: |
          cd deployment
          rm -rf linux-amd64 windows64 *.pdb debug*

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Deployment-${{ github.sha }}
          path: deployment

      - name: PreRelease
        if: github.event.inputs.publish == 'p'
        run: |
          ./ghr -prerelease -delete -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" "${{ github.event.inputs.tag }}" deployment

      - name: Release
        if: github.event.inputs.publish == 'r'
        run: |
          ./ghr -delete -t "${{ github.token }}" -n "${{ github.event.inputs.tag }}" "${{ github.event.inputs.tag }}" deployment
